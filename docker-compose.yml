# ============================================
# PCTO · Maturità 2026 — stack per Dokploy + TraefiKK
# ============================================
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: pcto
      DB_USER: pcto
      DB_PASS: ${DB_PASS:-pcto_password}
      CODICE_ACCESSO: ${CODICE_ACCESSO:-maturita2026}
      CODICE_ACCESSO_HASH: ${CODICE_ACCESSO_HASH:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-network   # <-- così Traefik lo raggiunge
      - default           # <-- così parla col db

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pcto
      MYSQL_USER: pcto
      MYSQL_PASSWORD: ${DB_PASS:-pcto_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-cambia_questa_root}
    volumes:
      - db_data:/var/lib/mysql
      - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default           # <-- il DB resta isolato, NON su dokploy-network

volumes:
  db_data:

networks:
  dokploy-network:
    external: true
  default: