# ============================================
# PCTO · Maturità 2026 — stack completo
# app (PHP+Apache) + db (MySQL 8.4)
# Pronto per DokPloy (tipo progetto: Compose)
# ============================================
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: pcto
      DB_USER: pcto
      DB_PASS: ${DB_PASS:-pcto_password}
      CODICE_ACCESSO: ${CODICE_ACCESSO:-maturita2026}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pcto
      MYSQL_USER: pcto
      MYSQL_PASSWORD: ${DB_PASS:-pcto_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-cambia_questa_root}
    volumes:
      - db_data:/var/lib/mysql
      # setup.sql viene eseguito automaticamente al primo avvio
      - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
